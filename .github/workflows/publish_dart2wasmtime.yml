name: Publish dart2wasmtime to crates.io
on:
  push:
    tags: ['dart2wasmtime-*']
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - run: cargo publish
      working-directory: dart2wasmtime
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
